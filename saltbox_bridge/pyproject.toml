[project]
dynamic = [ 'dependencies', 'version' ]
name = 'saltbox-bridge'
requires-python = '>=3.10'
license = 'Apache-2.0'
description = 'salt.box connector to salt master, service module'
readme = 'README.md'
classifiers = [
  'Topic :: System :: Systems Administration',
]

[project.scripts]

[metadata]
url = 'https://dev.saltbox.pro/salt.box'
version = 'attr: package.__version__'

[build-system]
requires = ['setuptools>=57.4.0', 'setuptools-scm']
build-backend = 'setuptools.build_meta'

[tool.setuptools.packages.find]
include = ['saltbox_bridge', 'saltbox_bridge.*']

[tool.setuptools.dynamic]
dependencies = { file = ['requirements.txt'] }
version = { attr = 'saltbox_bridge.__version__' }

[tool.flake8]  # Requires Flake8-pyproject
max-line-length = 120
extend-ignore = [ ]
builtins = [ '__opts__', '__salt__' ]
