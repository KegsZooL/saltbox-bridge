---

include:
  - project: 'salt.box/ci-lib'
    file: 'build-image.yml'

.build-salt-master:
  extends: .build-image
  variables:
    TARGET: salt-master
    REGISTRY_ADDITIONAL_PATH: '/salt-master'

Build salt-master for tag:
  extends: .build-salt-master
  variables:
    IMAGE_TAG: '$CI_COMMIT_TAG'
  rules:
    - if: '$CI_COMMIT_TAG'

Build salt-master image for branch:
  extends: .build-salt-master
  variables:
    IMAGE_TAG: '$CI_COMMIT_BRANCH'
  rules:
    - if: '$CI_COMMIT_BRANCH'
