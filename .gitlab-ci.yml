---

include:
  - project: 'saltbox/ci-lib'
    file: 'build-image.yml'
  - project: 'saltbox/ci-lib'
    file: 'def-branch-merge-guard.yml'

.lint-job:
  stage: test
  variables:
    PIP_CACHE_DIR: '$CI_PROJECT_DIR/.cache/pip'
  image: python:3.10-alpine
  before_script:
    - apk add git
    - pip3 install -e ./saltbox_bridge[dev,salt]
    - python -V
  cache:
    paths:
      - '.cache/pip/'

Ruff:
  extends: .lint-job
  script: 'ruff check saltbox_bridge --config ./saltbox_bridge/pyproject.toml'

Mypy:
  extends: .lint-job
  script: 'mypy saltbox_bridge --config-file ./saltbox_bridge/pyproject.toml'

Build salt-master for tag:
  stage: deploy
  extends: .build-image
  variables:
    IMAGE_TAG: '$CI_COMMIT_TAG'
    TARGET: salt-master
    REGISTRY_ADDITIONAL_PATH: '/salt-master'
  rules:
    - if: '$CI_COMMIT_TAG'

Build salt-master image for branch:
  stage: deploy
  extends: .build-image
  variables:
    IMAGE_TAG: '$CI_COMMIT_BRANCH'
    TARGET: salt-master
    REGISTRY_ADDITIONAL_PATH: '/salt-master'
  rules:
    - if: '$CI_COMMIT_BRANCH'
