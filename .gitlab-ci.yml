---

include:
  - project: 'salt.box/ci-lib'
    file: 'build-image.yml'


Build salt-master for tag:
  extends: .build-image
  variables:
    IMAGE_TAG: '$CI_COMMIT_TAG'
    TARGET: salt-master
    REGISTRY_ADDITIONAL_PATH: '/salt-master'
  rules:
    - if: '$CI_COMMIT_TAG'


Build salt-master image for branch:
  extends: .build-image
  variables:
    IMAGE_TAG: '$CI_COMMIT_BRANCH'
    TARGET: salt-master
    REGISTRY_ADDITIONAL_PATH: '/salt-master'
  rules:
    - if: '$CI_COMMIT_BRANCH'
