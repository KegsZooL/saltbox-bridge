[supervisord]
user=root
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:prepare-configs]
command=/usr/local/bin/prepare_configs.sh
autorestart=unexpected
startsecs=0
priority=0

[program:salt-master]
command=/usr/local/bin/salt-master -l '%(ENV_LOG_LEVEL)s'
environment=LOG_LEVEL='%(ENV_SALT_MASTER_LOG_LEVEL)s'
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:salt-api]
command=/usr/local/bin/salt-api -l '%(ENV_LOG_LEVEL)s'
environment=LOG_LEVEL='%(ENV_SALT_API_LOG_LEVEL)s'
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

